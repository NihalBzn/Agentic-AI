name: Agent Agentique CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-agent:
    runs-on: ubuntu-latest

    services:
      # Optionnel : Si votre DLQ utilise un service comme RabbitMQ/Redis en local pour les tests
      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Configuration de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install langflow pytest requests responses

    - name: Démarrage de Langflow en arrière-plan (Serveur de Test)
      run: |
        langflow run --host 127.0.0.1 --port 7860 &
        echo "Attente du démarrage de Langflow..."
        sleep 15 # Laisse le temps à l'instance de démarrer
      env:
        OPENAI_API_KEY: ${{ secrets.APIKEY1 }}
        L_SKIP_AUTH_AUTO_LOGIN: "true" # <-- Désactive le blocage d'authentification v1.5+

    - name: Exécution des 20 tests automatisés (y compris le test DLQ)
      run: |
        pytest test_agent.py -v --durations=0
      env:
        OPENAI_API_KEY: ${{ secrets.APIKEY1 }}
        L_API_URL: "http://127.0.0.1:7860/api/v1/run/87a0047e-83a1-4244-ab3e-c8df3ca85f0e"
